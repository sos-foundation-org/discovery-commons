name: Keep Supabase Alive

# Supabase Free pauses a project after ~7 days of inactivity. This pings the
# REST endpoint every 5 days so the prototype DB never sleeps.
# Configure repo secrets: SUPABASE_URL and SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "0 6 */5 * *" # every 5 days at 06:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL secret not set — skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          # 2xx/4xx both mean the project is awake; only network failure is bad.
          if [ "$code" = "000" ]; then
            echo "No response from Supabase" >&2
            exit 1
          fi
