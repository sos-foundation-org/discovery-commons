# ⚠️  NOT USED — local development uses SQLite (see docs/DEVELOPMENT.md).
# This file is retained for a future production Docker setup.
# Do not rely on it for local development.

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: discovery_commons
      POSTGRES_USER: dc_dev
      POSTGRES_PASSWORD: dc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
